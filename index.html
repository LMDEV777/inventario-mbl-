<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Inventário</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #2c2c2c;
      margin: 0;
      padding: 20px;
      color: white;
    }

    h1, h2 {
      text-align: center;
    }

    section, .box {
      background-color: #3a3a3a;
      padding: 20px;
      margin: 0 auto 20px auto;
      border-radius: 8px;
      max-width: 500px;
    }

    input {
      padding: 10px;
      margin-bottom: 10px;
      width: 100%;
      box-sizing: border-box;
      border: none;
      border-radius: 4px;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      background-color: #1a73e8;
      color: white;
      cursor: pointer;
      width: 100%;
      margin-bottom: 8px;
    }

    button:hover {
      background-color: #1557b0;
    }

    .btn-secundario {
      background-color: #555;
    }

    .senha-container {
      position: relative;
    }

    .btn-olho {
      position: absolute;
      right: 10px;
      top: 10px;
      width: auto;
      padding: 5px 10px;
      background-color: #555;
      font-size: 12px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background-color: #4a4a4a;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 6px;
    }

    .saldo-ok { color: #4caf50; }
    .saldo-falta { color: #ff9800; }
    .saldo-excesso { color: #f44336; }

    .escondido {
      display: none;
    }

    .topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 500px;
      margin: 0 auto 20px auto;
    }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="telaLogin">
    <h1>Sistema de Inventário</h1>

    <div class="box">
      <h2 id="tituloAuth">Entrar</h2>

      <input type="text" id="usuario" placeholder="Usuário">

      <div class="senha-container">
        <input type="password" id="senha" placeholder="Senha">
        <button type="button" class="btn-olho" onclick="mostrarSenha()">👁</button>
      </div>

      <button id="botaoPrincipal" onclick="fazerLogin()">Entrar</button>
      <button class="btn-secundario" onclick="mostrarCadastro()">Criar nova conta</button>
    </div>
  </div>

  <!-- SISTEMA PRINCIPAL -->
  <div id="sistema" class="escondido">

    <div class="topo">
      <h1>Sistema de Inventário</h1>
      <button onclick="sair()" style="width: auto;">Sair</button>
    </div>

    <section>
      <h2>Cadastrar Produto</h2>
      <input type="text" id="nomeProduto" placeholder="Nome do produto">
      <input type="number" id="quantidadeInicial" placeholder="Quantidade inicial" min="0">
      <button onclick="adicionarProduto()">Adicionar Produto</button>
    </section>

    <section>
      <h2>Estoque Atual</h2>
      <ul id="listaEstoque">
        <li>Nenhum produto cadastrado ainda.</li>
      </ul>
    </section>

    <section>
      <h2>Retirar Material</h2>
      <input type="text" id="codigoOP" placeholder="Código da Ordem de Produção">
      <input type="number" id="quantidadeOP" placeholder="Quantidade pedida pela OP" min="1">
      <input type="text" id="produtoRetirada" placeholder="Nome do produto">
      <input type="number" id="quantidadeRetirada" placeholder="Quantidade a retirar" min="1">
      <button onclick="retirarMaterial()">Retirar</button>
    </section>

    <section>
      <h2>Saldo por Ordem de Produção</h2>
      <ul id="listaSaldo">
        <li>Nenhuma retirada registrada ainda.</li>
      </ul>
    </section>

  </div>

  <script>
    // ===================== DADOS =====================
    let produtos = JSON.parse(localStorage.getItem("produtos")) || [];
    let saldos = JSON.parse(localStorage.getItem("saldos")) || {};
    let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

    // ===================== HASH DA SENHA =====================
    async function gerarHash(texto) {
      const encoder = new TextEncoder();
      const data = encoder.encode(texto);
      const hashBuffer = await crypto.subtle.digest("SHA-256", data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
    }

    function mostrarSenha() {
      const campo = document.getElementById("senha");
      campo.type = campo.type === "password" ? "text" : "password";
    }

    // ===================== LOGIN / CADASTRO =====================
    let modoCadastro = false;

    function mostrarCadastro() {
      modoCadastro = !modoCadastro;
      const titulo = document.getElementById("tituloAuth");
      const botao = document.getElementById("botaoPrincipal");

      if (modoCadastro) {
        titulo.innerText = "Criar Conta";
        botao.innerText = "Cadastrar";
        botao.onclick = cadastrarUsuario;
      } else {
        titulo.innerText = "Entrar";
        botao.innerText = "Entrar";
        botao.onclick = fazerLogin;
      }
    }

    async function cadastrarUsuario() {
      const usuario = document.getElementById("usuario").value.trim();
      const senha = document.getElementById("senha").value;

      if (!usuario || !senha) {
        alert("Preencha usuário e senha!");
        return;
      }

      if (usuarios.find(u => u.usuario === usuario)) {
        alert("Esse usuário já existe!");
        return;
      }

      const senhaHash = await gerarHash(senha);
      usuarios.push({ usuario, senha: senhaHash });
      localStorage.setItem("usuarios", JSON.stringify(usuarios));

      alert("Conta criada com sucesso! Agora faça login.");
      mostrarCadastro();
      document.getElementById("usuario").value = "";
      document.getElementById("senha").value = "";
    }

    async function fazerLogin() {
      const usuario = document.getElementById("usuario").value.trim();
      const senha = document.getElementById("senha").value;

      const senhaHash = await gerarHash(senha);
      const encontrado = usuarios.find(u => u.usuario === usuario && u.senha === senhaHash);

      if (!encontrado) {
        alert("Usuário ou senha incorretos!");
        return;
      }

      document.getElementById("telaLogin").classList.add("escondido");
      document.getElementById("sistema").classList.remove("escondido");
      atualizarLista();
      atualizarSaldo();
    }

    function sair() {
      document.getElementById("sistema").classList.add("escondido");
      document.getElementById("telaLogin").classList.remove("escondido");
      document.getElementById("usuario").value = "";
      document.getElementById("senha").value = "";
    }

    // ===================== PRODUTOS =====================
    function adicionarProduto() {
      const nome = document.getElementById("nomeProduto").value.trim();
      const quantidade = Number(document.getElementById("quantidadeInicial").value);

      if (!nome) {
        alert("Digite o nome do produto!");
        return;
      }
      if (isNaN(quantidade) || quantidade < 0) {
        alert("Digite uma quantidade válida!");
        return;
      }

      const existente = produtos.find(p => p.nome.toLowerCase() === nome.toLowerCase());
      if (existente) {
        existente.quantidade += quantidade;
      } else {
        produtos.push({ nome, quantidade });
      }

      localStorage.setItem("produtos", JSON.stringify(produtos));
      document.getElementById("nomeProduto").value = "";
      document.getElementById("quantidadeInicial").value = "";
      atualizarLista();
    }

    // ===================== RETIRADA =====================
    function retirarMaterial() {
      const codigoOP = document.getElementById("codigoOP").value.trim();
      const quantidadeOP = Number(document.getElementById("quantidadeOP").value);
      const nome = document.getElementById("produtoRetirada").value.trim();
      const quantidadeSolicitada = Number(document.getElementById("quantidadeRetirada").value);

      if (!codigoOP || !nome || isNaN(quantidadeOP) || isNaN(quantidadeSolicitada) || quantidadeSolicitada <= 0) {
        alert("Preencha todos os campos corretamente!");
        return;
      }

      const produto = produtos.find(p => p.nome.toLowerCase() === nome.toLowerCase());
      if (!produto) {
        alert("Produto não encontrado!");
        return;
      }

      const chave = `${codigoOP}|${nome.toLowerCase()}`;

      if (!saldos[chave]) {
        saldos[chave] = {
          codigoOP: codigoOP,
          produto: nome,
          quantidadeOP: quantidadeOP,
          totalRetirado: 0
        };
      }

      const saldo = saldos[chave];
      const falta = saldo.quantidadeOP - saldo.totalRetirado;

      let quantidadeReal = Math.min(
        quantidadeSolicitada,
        produto.quantidade,
        falta > 0 ? falta : quantidadeSolicitada
      );

      if (quantidadeReal <= 0) {
        if (produto.quantidade <= 0) {
          alert("Estoque insuficiente!");
        } else {
          alert("Essa OP já está completa para este produto!");
        }
        return;
      }

      produto.quantidade -= quantidadeReal;
      saldo.totalRetirado += quantidadeReal;

      localStorage.setItem("produtos", JSON.stringify(produtos));
      localStorage.setItem("saldos", JSON.stringify(saldos));

      document.getElementById("codigoOP").value = "";
      document.getElementById("quantidadeOP").value = "";
      document.getElementById("produtoRetirada").value = "";
      document.getElementById("quantidadeRetirada").value = "";

      atualizarLista();
      atualizarSaldo();

      if (quantidadeReal < quantidadeSolicitada) {
        alert(`Retirado apenas ${quantidadeReal} unidades (limitado pelo saldo da OP ou estoque).`);
      } else {
        alert("Retirada realizada com sucesso!");
      }
    }

    // ===================== ATUALIZAR TELAS =====================
    function atualizarLista() {
      const lista = document.getElementById("listaEstoque");

      if (produtos.length === 0) {
        lista.innerHTML = "<li>Nenhum produto cadastrado ainda.</li>";
        return;
      }

      lista.innerHTML = "";
      produtos.forEach(p => {
        lista.innerHTML += `<li><strong>${p.nome}</strong> — Quantidade: ${p.quantidade}</li>`;
      });
    }

    function atualizarSaldo() {
      const lista = document.getElementById("listaSaldo");
      const chaves = Object.keys(saldos);

      if (chaves.length === 0) {
        lista.innerHTML = "<li>Nenhuma retirada registrada ainda.</li>";
        return;
      }

      lista.innerHTML = "";

      chaves.forEach(chave => {
        const item = saldos[chave];
        const falta = item.quantidadeOP - item.totalRetirado;

        let status = "";
        let classe = "";

        if (falta > 0) {
          status = `Faltam ${falta} unidades`;
          classe = "saldo-falta";
        } else if (falta < 0) {
          status = `Retirou ${Math.abs(falta)} a mais`;
          classe = "saldo-excesso";
        } else {
          status = "Completo";
          classe = "saldo-ok";
        }

        lista.innerHTML += `
          <li>
            <strong>OP: ${item.codigoOP}</strong><br>
            Produto: ${item.produto}<br>
            Pedido pela OP: ${item.quantidadeOP}<br>
            Já retirado: ${item.totalRetirado}<br>
            <span class="${classe}">${status}</span>
          </li>
        `;
      });
    }
  </script>

</body>
</html>
